
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শিক্ষক-কর্মচারী ব্যবস্থাপনা</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h2>আব্দুল্লাহ হাট ইসলামিয়া ফাজিল (ডিগ্রী) মাদ্রাসা</h2>
  <p>নাটেশ্বর, সোনাইমুড়ী, নোয়াখালী</p>
</header>

<main class="container">
  <h2>শিক্ষক-কর্মচারী ব্যবস্থাপনা</h2>

  <section class="card">
    <h3 id="employeeFormTitle">নতুন শিক্ষক/কর্মচারী যোগ করুন</h3>

    <form id="employeeForm">
      <input type="hidden" id="employeeEditId">

      <label>নাম *</label>
      <input id="employeeName" required placeholder="পূর্ণ নাম">

      <label>পদবি *</label>
      <input id="employeeDesignation" required placeholder="যেমন: সহকারী শিক্ষক">

      <label>ধরন</label>
      <select id="employeeType">
        <option value="শিক্ষক">শিক্ষক</option>
        <option value="কর্মচারী">কর্মচারী</option>
      </select>

      <label>মোবাইল নম্বর</label>
      <input id="employeeMobile" type="tel">

      <label>ইমেইল</label>
      <input id="employeeEmail" type="email">

      <label>ঠিকানা</label>
      <textarea id="employeeAddress"></textarea>

      <label>শিক্ষাগত যোগ্যতা</label>
      <input id="employeeQualification" placeholder="যেমন: কামিল / ফাজিল / স্নাতক">

      <label>মাসিক বেতন</label>
      <input id="employeeSalary" type="number" min="0" placeholder="টাকা">

      <label>যোগদানের তারিখ</label>
      <input id="employeeJoinDate" type="date">

      <label>চাকরির বিবরণ</label>
      <textarea id="employeeJobDetails" placeholder="অতিরিক্ত তথ্য বা চাকরির বিবরণ"></textarea>

      <label>ছবি</label>
      <input id="employeePhoto" type="file" accept="image/*">
      <img id="employeePhotoPreview" style="display:none;width:100px;height:100px;object-fit:cover;margin-top:10px;border-radius:8px;">

      <p id="employeeMessage"></p>

      <button type="submit" id="employeeSaveButton">তথ্য সংরক্ষণ করুন</button>
      <button type="button" id="employeeCancelButton" style="display:none;">সম্পাদনা বাতিল</button>
    </form>
  </section>

  <section class="card">
    <h3>শিক্ষক-কর্মচারীর তালিকা</h3>
    <p>মোট সদস্য: <strong id="employeeCount">০</strong></p>

    <input id="employeeSearch" placeholder="নাম, পদবি বা মোবাইল দিয়ে খুঁজুন">

    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>ছবি</th>
            <th>আইডি</th>
            <th>নাম ও পদবি</th>
            <th>ধরন</th>
            <th>মোবাইল</th>
            <th>যোগ্যতা</th>
            <th>বেতন</th>
            <th>যোগদানের তারিখ</th>
            <th>কাজ</th>
          </tr>
        </thead>
        <tbody id="employeeTableBody"></tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <p>© Abdullah Hat Islamia Fazil (Degree) Madrasah</p>
</footer>

<script src="script.js"></script>
<script src="employee.js"></script>
</body>
</html>
